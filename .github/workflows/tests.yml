name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # Pure-logic and CPU-emulation layers. Checks against the real game.exe are
    # skipped here (the executable is not in the repository); run them locally.
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      RA2_REQUIRE_EMULATION: "1"  # a missing unicorn fails instead of skipping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
